<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager- Update</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Task Manager</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form class="add" method="post" action="/add">
    <input type="text" name="title" placeholder="New task" required maxlength="200">
    <button>Add</button>
  </form>
  <ul>
    {% for t in tasks %}
    <li class="{{ 'done' if t.done }}">
      <span>{{ t.title }}</span>
      <div>
        <form method="post" action="/toggle/{{ t.id }}" style="display:inline"><button>{{ 'Undo' if t.done else 'Done' }}</button></form>
        <form method="post" action="/delete/{{ t.id }}" style="display:inline"><button>Delete</button></form>
      </div>
    </li>
    {% else %}
    <li>No tasks yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
