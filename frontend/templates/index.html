<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    form.add { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type=text] { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #ddd; }
    .done span { text-decoration: line-through; color: #888; }
    ul { list-style: none; padding: 0; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form class="add" method="post" action="/add">
    <input type="text" name="title" placeholder="New task" required maxlength="200">
    <button>Add</button>
  </form>
  <ul>
    {% for t in tasks %}
    <li class="{{ 'done' if t.done }}">
      <span>{{ t.title }}</span>
      <div>
        <form method="post" action="/toggle/{{ t.id }}" style="display:inline"><button>{{ 'Undo' if t.done else 'Done' }}</button></form>
        <form method="post" action="/delete/{{ t.id }}" style="display:inline"><button>Delete</button></form>
      </div>
    </li>
    {% else %}
    <li>No tasks yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
